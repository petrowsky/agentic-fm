name: Webviewer

on:
  push:
    branches: [main]
    paths:
      - "webviewer/**"
      - ".github/workflows/webviewer.yml"
  pull_request:
    paths:
      - "webviewer/**"
      - ".github/workflows/webviewer.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webviewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
