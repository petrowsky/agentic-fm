.nav-overlay .submenu-host{pointer-events:auto;width:100%;position:relative;z-index:21}
.bar{
  display:flex;justify-content:center;align-items:stretch;
  background:transparent;border:0;box-shadow:none;padding:0 4px;
  flex:0 0 auto;visibility:visible;opacity:1;
}
.nav{
  display:flex;flex-wrap:nowrap;justify-content:center;align-items:stretch;
  gap:var(--nav-gap);max-width:100%;overflow-x:auto;visibility:visible;opacity:1;
}
.nav::-webkit-scrollbar{height:0}
.seg{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;min-width:83px;height:var(--seg-h);padding:4px var(--nav-pad-x) 5px;
  border:1px solid rgba(0,0,0,.14);border-radius:var(--radius);
  background:var(--seg-bg);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 8px rgba(0,0,0,.28);
  font:600 var(--font)/1.05 Helvetica Neue,Helvetica,Arial,sans-serif;
  cursor:pointer;user-select:none;white-space:nowrap;
  transition:filter .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;
}
/* .seg.is-hot / :hover / .menu-open — color-only highlight (no scale; fixed layout) */
.seg:hover,
.seg.menu-open{
  filter:none;
  border-color:var(--seg-hot-border);
  background:var(--seg-hot-bg);
  box-shadow:var(--seg-hot-shadow);
}
.seg.menu-open{z-index:2}
.seg:active{
  filter:none;
  background:linear-gradient(180deg,var(--lime) 0%,var(--lime-deep) 100%);
  border-color:rgba(0,0,0,.42);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.22),0 1px 5px rgba(0,0,0,.32);
}
.seg .ico{width:14px;height:14px;flex:0 0 14px;display:block}
.seg .lbl{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.seg .chev{font-size:9px;opacity:.7;margin-left:2px}
.seg.exit{margin-left:8px;min-width:75px}
.submenu-host{
  position:relative;display:block;width:100%;margin-top:10px;min-height:0;
  padding-bottom:6px;
}
.submenu{
  position:absolute;top:0;left:50%;
  display:flex;flex-direction:row;flex-wrap:wrap;justify-content:center;
  gap:var(--sub-gap);max-width:min(980px,100%);
  background:transparent;border:0;box-shadow:none;padding:0;
  transform:translateX(-50%);
}
.subbtn{
  display:flex;align-items:center;gap:6px;
  flex:0 0 auto;padding:var(--subbtn-pad-y) var(--subbtn-pad-x);
  min-height:0;
  border:1px solid rgba(0,0,0,.16);border-radius:var(--radius);
  background:var(--subbtn-bg);color:var(--ink);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.28);
  font:600 var(--font-sub)/1.15 Helvetica Neue,Helvetica,Arial,sans-serif;
  cursor:pointer;user-select:none;white-space:nowrap;
  transition:filter .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;
}
.subbtn:hover{
  filter:none;
  border-color:var(--subbtn-hot-border);
  background:var(--subbtn-hot-bg);
  box-shadow:var(--subbtn-hot-shadow);
}
.subbtn:active{
  filter:none;
  background:var(--subbtn-active-bg);
  border-color:rgba(0,0,0,.42);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.22),0 1px 5px rgba(0,0,0,.32);
}
.subbtn .ico{width:15px;height:15px;flex:0 0 15px}
.menu-anim-in{animation:menuIn .14s ease-out;transform-origin:top center}
@keyframes menuIn{
  from{opacity:0;transform:translateX(-50%) translateY(-6px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}
}
.hidden{display:none!important}
@media (max-width:900px){
  :root{--seg-h:36px;--font:11px;--nav-gap:6px}
  .brand-title{white-space:normal;max-width:48vw;font-size:clamp(13px,1.8vw,18px)}
  .politi-logo{height:clamp(70px,11.4vh,94px)}
  .streck{left:5%;width:clamp(130px,24vw,190px);height:88px}
  .nav-overlay{padding-top:8px}
}

<script>
function fm(script,param){
  if(param===undefined||param===null) param='';
  try{ closeAllMenus(); }catch(e0){}
  try{
    var FM=window.FileMaker;
    try{ if(!FM) FM=parent.FileMaker; }catch(e1){}
    /* Option 0 = Continue. Do NOT use 3 (Resume) — scripts never start from idle. */
    if(FM && FM.PerformScript){ FM.PerformScript(String(script), String(param)); return true; }
    if(FM && FM.PerformScriptWithOption){ FM.PerformScriptWithOption(String(script), String(param), 0); return true; }
  }catch(e){
    try{ console.error('fm error', e); }catch(e2){}
  }
  try{ console.log('fm (no FileMaker bridge)', script, param); }catch(e3){}
  return false;
}
function closeAllMenus(){
  var menus=document.querySelectorAll('.submenu');
  for(var i=0;i<menus.length;i++){
    menus[i].classList.add('hidden');
    menus[i].classList.remove('menu-anim-in');
    menus[i].style.left='';
    menus[i].style.transform='';
  }
  var btns=document.querySelectorAll('.seg.menu-open');
  for(var j=0;j<btns.length;j++){ btns[j].classList.remove('menu-open'); }
}
function positionSubmenu(menu,btn){
  var host=menu.parentElement;
  if(!host||!btn) return;
  var hostRect=host.getBoundingClientRect();
  var btnRect=btn.getBoundingClientRect();
  var pad=6;
  var center=btnRect.left+btnRect.width*0.5-hostRect.left;
  menu.style.left=center+'px';
  menu.style.transform='translateX(-50%)';
  var menuW=menu.offsetWidth;
  var hostW=host.clientWidth;
  if(menuW<=0||hostW<=0) return;
  var half=menuW*0.5;
  var minC=pad+half;
  var maxC=hostW-pad-half;
  if(maxC<minC) center=hostW*0.5;
  else if(center<minC) center=minC;
  else if(center>maxC) center=maxC;
  menu.style.left=Math.round(center)+'px';
}
function toggleMenu(menuId,btn,event){
  if(event){ event.stopPropagation(); event.preventDefault(); }
  var menu=document.getElementById(menuId);
  if(!menu) return;
  var wasHidden=menu.classList.contains('hidden');
  closeAllMenus();
  if(wasHidden){
    btn.classList.add('menu-open');
    menu.classList.remove('hidden');
    positionSubmenu(menu,btn);
    void menu.offsetWidth;
    menu.classList.add('menu-anim-in');
  }
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.submenu') && !e.target.closest('.seg[data-menu]')) closeAllMenus();
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAllMenus(); });
window.addEventListener('resize',function(){
  var open=document.querySelector('.seg.menu-open');
  if(!open) return;
  var menuId=open.getAttribute('data-menu');
  var menu=menuId?document.getElementById(menuId):null;
  if(menu&&!menu.classList.contains('hidden')) positionSubmenu(menu,open);
});

</script>
