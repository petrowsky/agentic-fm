<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,Helvetica Neue,sans-serif;
  background:#07121c;
  color:white;overflow:hidden;
}
html.web-scroll,html.web-scroll body{
  height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto;
}
.wrapper{box-sizing:border-box;width:100%;height:100%;padding:14px 16px;display:flex;flex-direction:column}

.header{display:flex;flex-direction:column;margin-bottom:12px;flex:0 0 auto}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;}
.header-main{min-width:0;flex:1 1 auto}
.title{font-size:22px;font-weight:400;line-height:1.1}
.subtitle{margin-top:2px;color:#b7c5d3;font-size:12px}
.updated{color:#9aacbb;font-size:11px;text-align:right;padding-top:4px}
.chrome{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:12px;width:100%}
.chip-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip-sep{width:1px;height:26px;background:rgba(255,255,255,.18);margin:0 4px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#dce6ee;font-size:13px;cursor:pointer}
.chip.active{background:rgba(88,151,230,.28);border-color:rgba(147,197,253,.55);color:#fff}
.chip:disabled,.chip.disabled{opacity:.38;cursor:not-allowed}
.chrome-note{display:none;color:#93c5fd;font-size:12px}.chrome-note.show{display:block}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:8px;flex:0 0 auto}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 10px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.035)}
.meta-item{color:#aebdca;font-size:12px}.meta-item strong{color:#e8eef4;font-size:13px}
.kpi,.card{background:rgba(16,34,50,.96);border:1px solid rgba(255,255,255,.055)}
.kpi{border-radius:10px;padding:5px 9px;min-height:0}
.kpi-label{color:#aebdca;font-size:10px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-size:16px;font-weight:400;line-height:1.05}
.grid{display:grid;grid-template-columns:1.55fr .78fr;gap:14px;flex:1 1 auto;min-height:0}
.card{border-radius:14px;padding:12px 14px;min-height:0;display:flex;flex-direction:column}
.card-title{font-size:16px;font-weight:400;margin-bottom:6px;flex:0 0 auto}
.chart-wrap{width:100%;flex:0 0 auto;overflow:visible;padding-bottom:4px;box-sizing:border-box}
.chart-inner{position:relative;width:100%}
.chart-inner canvas{display:block;width:100% !important;height:100% !important;cursor:pointer}
.table{margin-top:6px;font-size:12.5px;color:#dce6ee;overflow:auto;flex:1 1 auto;min-height:0}
.table-header,.row{
  display:grid;grid-template-columns:1.24fr .72fr .82fr .82fr 1.08fr 1.14fr 1.08fr;
  column-gap:8px;align-items:center;
}
.table-header{color:#8fa2b3;font-size:11px;font-weight:400;padding:0 0 8px 0;border-bottom:1px solid rgba(255,255,255,.18)}
.table-header span{text-align:center}
.table-header span:first-child{text-align:left}
.table-header .sort-hdr{cursor:pointer;user-select:none}.table-header .sort-hdr.active{color:#93c5fd}.sort-ind{display:inline-block;min-width:.9em;margin-left:2px;font-size:10px}
.row{border-bottom:1px solid rgba(255,255,255,.07);padding:6px 0}
.row.base-row{cursor:pointer;border-radius:6px;padding:6px 4px}
.row.base-row.selected{background:rgba(88,151,230,.14)}
.row.top-base span:first-child{color:#93c5fd}
.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.base-detail{display:none;flex:1 1 auto;flex-direction:column;min-height:300px}
.base-detail.open{display:flex !important}
.chart-overview{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
.chart-overview.hidden{display:none !important}
.back-btn,.drill-btn{align-self:flex-start;margin-bottom:8px;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#dce6ee;font-size:12px;cursor:pointer}
.drill-btn{margin-top:4px;border-color:rgba(147,197,253,.35);background:rgba(88,151,230,.14)}
.detail-subtitle{color:#8fa2b3;font-size:12px;margin:-2px 0 8px}
.detail-metrics{flex:1 1 auto;overflow:auto;padding:4px 0}
.kpi-dual{font-size:11px;line-height:1.3;color:#b7c5d3}
.kpi-dual strong{color:#e8eef4;font-weight:400}
.kpi-dual .delta{color:#93c5fd;margin-left:4px}
.table.yoy .table-header,.table.yoy .row{grid-template-columns:1.2fr .55fr .55fr .55fr .65fr .65fr .55fr}
.pilots-table{margin-top:8px;font-size:13px;color:#dce6ee;overflow:auto;flex:1 1 auto;min-height:200px}
.pilots-table .table-header,.pilots-table .row{grid-template-columns:1.5fr .8fr .8fr}
.pilots-table.yoy .table-header,.pilots-table.yoy .row{grid-template-columns:1.3fr .55fr .55fr .65fr .65fr}
.pilots-table .table-header span:not(:first-child),.pilots-table .row span:not(:first-child){text-align:right}
.note{margin-top:8px;color:#8fa2b3;font-size:12px;flex:0 0 auto}

.mr{display:grid;grid-template-columns:70px 1fr 68px;gap:8px;align-items:center;margin:0 0 9px}.ml{color:#aebdca;font-size:12px}.mv{text-align:right;color:#e2e8f0;font-size:12px}.mbg{height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}.mb{height:100%;border-radius:7px;min-width:2px}.mb.m{background:rgba(147,197,253,.92)}.mb.l{background:rgba(129,140,248,.88)}.mb.h{background:rgba(88,151,230,.88)}.mb.i{background:rgba(56,189,248,.85)}.mb.n{background:rgba(99,102,241,.85)}.mb.g{background:rgba(45,212,191,.82)}.yb{display:flex;flex-direction:column;gap:2px}.yr{grid-template-columns:70px 1fr auto}.mb.yp{background:rgba(147,197,253,.85)}.mb.yc{background:rgba(45,212,191,.82)}.d{color:#93c5fd}</style>
</head>
<body>
<div class='wrapper'>
  <div class='header'>
    <div class='header-top'>
      <div class='header-main'>
        <div class='title'>AvinOps</div>
        <div class='subtitle' id='period'>Loading...</div>
      </div>
      <div class='updated'>Updated: %%UPDATED%%</div>
    </div>
    <div class='chrome' id='chrome'>
      <div class='chip-row' id='periodRow' >
        <button class='chip' type='button' data-period='7d' onclick="setPeriod('7d')">7d</button>
        <button class='chip' type='button' data-period='30d' onclick="setPeriod('30d')">30d</button>
        <button class='chip' type='button' data-period='year' id='yearChip' onclick="setPeriod('year')">2026</button>
        <button class='chip' type='button' data-period='yoy' onclick="setPeriod('yoy')">YoY</button>
      </div>
      <div class='chip-sep' ></div>
      <div class='chip-row' id='viewRow' role='group' >
        <button class='chip' type='button' data-view='bases' onclick="setView('bases')">Bases</button>
        <button class='chip' type='button' data-view='pilots' onclick="setView('pilots')">Pilots</button>
        <button class='chip' type='button' data-view='htc' onclick="setView('htc')">HTC</button>
        <button class='chip disabled' disabled>M</button>
        <button class='chip' type='button' data-view='types' onclick="setView('types')">Types</button>
      </div>
      <div class='chrome-note' id='chromeNote'></div>
    </div>
  </div>

  <div class='kpis'>
    <div class='kpi'><div class='kpi-label'>Missions</div><div class='kpi-value' id='missions'>0</div></div>
    <div class='kpi'><div class='kpi-label'>Hours</div><div class='kpi-value' id='flightHours'>0.0</div></div>
    <div class='kpi'><div class='kpi-label'>Landings</div><div class='kpi-value' id='landings'>0</div></div>
    <div class='kpi'><div class='kpi-label'>IFR Hours</div><div class='kpi-value' id='ifrHours'>0.0</div></div>
    <div class='kpi'><div class='kpi-label'>Night Hours</div><div class='kpi-value' id='nightHours'>0.0</div></div>
    <div class='kpi'><div class='kpi-label'>NVG Hours</div><div class='kpi-value' id='nvgHours'>0.0</div></div>
  </div>

  <div class='meta-row'>
    <div class='meta-item'>Avg <strong id='avgFlightTime'>0.0 h</strong></div>
    <div class='meta-item'>IFR% <strong id='ifrShare'>0%</strong></div>
    <div class='meta-item'>Night% <strong id='nightShare'>0%</strong></div>
    <div class='meta-item'>NVG% <strong id='nvgShare'>0%</strong></div>
  </div>

  <div class='grid'>
    <div class='card' id='baseChartCard'>
      <div class='chart-overview' id='chartOverview'>
        <div class='card-title'>Missions & Hours</div>
        <div class='chart-wrap'><div class='chart-inner' id='baseChartHost'><canvas id='baseChart'></canvas></div></div>
        <div class='note' style='margin-top:8px'>Click base</div>
      </div>
      <div class='base-detail' id='baseDetail'>
        <button class='back-btn' type='button' id='btnBackFromDetail'>Back</button>
        <div class='card-title' id='detailBaseName'>Base</div>
        <div class='detail-subtitle' id='detailBaseRank'></div>
        <div class='detail-metrics' id='detailMetrics'></div>
        <button class='drill-btn' type='button' id='btnShowPilots'>Pilots</button>
      </div>
    </div>
    <div class='card' id='rightCard'>
      <div class='card-title' id='rightCardTitle'>Top Bases</div>
      <div id='baseTableWrap'>
      <div class='table'>
        <div class='table-header' id='baseListHeader'>
          <span class='sort-hdr' data-sort='base' onclick="sortBaseList('base')">Base<span class='sort-ind'></span></span>
          <span class='sort-hdr' data-sort='missions' onclick="sortBaseList('missions')">Mis<span class='sort-ind'></span></span>
          <span class='sort-hdr' data-sort='hours' onclick="sortBaseList('hours')">Hours<span class='sort-ind'></span></span>
          <span class='sort-hdr' data-sort='avg' onclick="sortBaseList('avg')">Avg<span class='sort-ind'></span></span>
          <span class='sort-hdr' data-sort='ifr' onclick="sortBaseList('ifr')">IFR<span class='sort-ind'></span></span>
          <span class='sort-hdr' data-sort='night' onclick="sortBaseList('night')">Night<span class='sort-ind'></span></span>
          <span class='sort-hdr' data-sort='nvg' onclick="sortBaseList('nvg')">NVG<span class='sort-ind'></span></span>
        </div>
        <div id='baseList'></div>
      </div>
      </div>
      <div id='pilotsRightWrap' style='display:none'>
        <div class='pilots-table'>
          <div class='table-header'>
            <span>Pilot</span><span>Missions</span><span>Hours</span>
          </div>
          <div id='pilotsRightList'></div>
        </div>
      </div>
      <div class='note'>Sorts</div>
    </div>
  </div>
</div>

<script>function fm(script,param){if(param===undefined||param===null){param='';}try{var FM=window.FileMaker;try{if(!FM)FM=parent.FileMaker;}catch(e1){}if(FM&&FM.PerformScript){FM.PerformScript(script,param);return true;}}catch(e){}return false;}if(String('%%IS_WEB%%')==='1'){document.documentElement.classList.add('web-scroll');}window.__avinopsDrilledIn=false;const dashboard=JSON.parse(decodeURIComponent(escape(atob('%%JSON_B64%%'))));const isYoy=dashboard.mode==='yoy'||String('%%CACHE%%').indexOf('_YOY')>=0;const period=dashboard.period||{};const pilotFlights=dashboard.pilotFlights||[];const pfPrior=dashboard.pilotFlightsPrior||[];const pfCurr=dashboard.pilotFlightsCurr||pilotFlights;var kpi=dashboard.kpi||{};var bases=dashboard.bases||[];if(isYoy){var map={};function ingest(arr,side){(arr||[]).forEach(function(b){var n=String(b.base||'').trim();if(!n)return;if(!map[n])map[n]={base:n,prior:{},curr:{}};var t=map[n][side];['missions','hours','ifr','night','nvg','landings'].forEach(function(k){t[k]=Number(b[k]||0);});});}ingest(dashboard.basesPrior,'prior');ingest(dashboard.basesCurr,'curr');bases=Object.keys(map).map(function(k){var o=map[k],c=o.curr||{};o.missions=c.missions||0;o.hours=c.hours||0;o.ifr=c.ifr||0;o.night=c.night||0;o.nvg=c.nvg||0;o.landings=c.landings||0;return o;}).sort(function(a,b){return(b.curr.missions||0)-(a.curr.missions||0);});kpi={prior:(dashboard.kpi&&dashboard.kpi.prior)||{},curr:(dashboard.kpi&&dashboard.kpi.curr)||{}};}var baseChart=null;var drillLevel=0;var selectedBaseIdx=-1;var YEAR=String(new Date().getFullYear());var PY=String((period.priorYear!=null)?period.priorYear:(Number(YEAR)- 1));var CY=String((period.currYear!=null)?period.currYear:YEAR);var ym=PY.slice(2),yc=CY.slice(2);var INITIAL_CACHE=String('%%CACHE%%');var uiState={period:'7d',view:'bases'};var PERIOD_LABELS={'7d':'7 days','30d':'30 days',year:YEAR,yoy:'YoY'};var VIEW_LABELS={bases:'Bases',pilots:'Pilots',htc:'HTC',types:'Types'};function periodFromSuffix(s){s=String(s||'').trim().toUpperCase();return s==='7D'?'7d':s==='30D'?'30d':s==='YOY'?'yoy':'year';}function cacheKeyFor(v,p){var pref=v==='pilots'?'PilotStats_':v==='htc'?'HTCStats_':v==='types'?'HELI_TYPE_':'OPS_';return p==='yoy'?pref+'YOY':pref+(p==='7d'?'7D':p==='30d'?'30D':YEAR);}function resolveFromCache(n){n=String(n||'').trim();if(!n||n.indexOf('%%')===0)return null;var v=n.indexOf('PilotStats')===0?'pilots':n.indexOf('HTCStats')===0?'htc':n.indexOf('HELI_TYPE')===0?'types':n.indexOf('OPS_')===0?'bases':null;if(!v)return null;if(/_YOY$/.test(n))return{view:v,period:'yoy'};return{view:v,period:(n==='PilotStats'||n==='HTCStats')?'7d':periodFromSuffix(n.split('_').pop())};}function showChromeNote(m){var el=document.getElementById('chromeNote');if(!el)return;if(!m){el.textContent='';el.classList.remove('show');return;}el.textContent=m;el.classList.add('show');}function syncChrome(){document.querySelectorAll('#periodRow .chip').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-period')===uiState.period);});document.querySelectorAll('#viewRow .chip').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-view')===uiState.view&&!b.disabled);});updateSubtitle();}function updateSubtitle(){var label=(period&&period.label)?String(period.label):(PERIOD_LABELS[uiState.period]||'7 days');var text=VIEW_LABELS[uiState.view]+'|'+label;if(isYoy&&period.priorStart&&period.currEnd){text+='|'+fmtDate(period.priorStart)+'/'+fmtDate(period.currStart)+' - '+fmtDate(period.through||period.currEnd);}else if(period&&period.start&&period.end){text+='|'+fmtDate(period.start)+' - '+fmtDate(period.end);}var el=document.getElementById('period');if(el)el.textContent=text;}function setPeriod(p){if(p!=='7d'&&p!=='30d'&&p!=='year'&&p!=='yoy')return;if(!fm('AM Dashboard Go To Cache',cacheKeyFor(uiState.view,p)))showChromeNote('No Go To Cache');}function setView(v){if(v==='medical'||!VIEW_LABELS[v])return;if(!fm('AM Dashboard Go To Cache',cacheKeyFor(v,uiState.period)))showC
